[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "agency-workforce-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.32,<1.0", "pydantic-settings>=2.6,<3.0", "httpx>=0.27,<1.0"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
