name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agency_workforce_test
          POSTGRES_USER: agency_test
          POSTGRES_PASSWORD: agency_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agency_test -d agency_workforce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agency_test:agency_test_password@localhost:5432/agency_workforce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e '.[dev]'
        working-directory: backend
      - name: Generate migration candidates for clean-schema smoke test
        run: python manage.py makemigrations organizations workforce feed delivery audit eod hr approvals whatsapp
        working-directory: backend
        env: { DJANGO_SECRET_KEY: ci-only-not-a-secret, DJANGO_DEBUG: 'true' }
      - name: Apply schema to a clean database
        run: python manage.py migrate --noinput
        working-directory: backend
        env: { DJANGO_SECRET_KEY: ci-only-not-a-secret, DJANGO_DEBUG: 'true' }
      - name: Verify model and migration state
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
        env: { DJANGO_SECRET_KEY: ci-only-not-a-secret, DJANGO_DEBUG: 'true' }
      - name: Verify PostgreSQL backup restoration
        env:
          PGPASSWORD: agency_test_password
          RESTORE_URL: postgres://agency_test:agency_test_password@localhost:5432/agency_workforce_restore
          MAINTENANCE_URL: postgres://agency_test:agency_test_password@localhost:5432/postgres
        run: |
          set -euo pipefail
          pg_dump --format=custom --file=/tmp/agency-workforce-ci.dump "$DATABASE_URL"
          createdb --maintenance-db="$MAINTENANCE_URL" agency_workforce_restore
          pg_restore --exit-on-error --no-owner --dbname="$RESTORE_URL" /tmp/agency-workforce-ci.dump
          psql "$RESTORE_URL" --tuples-only --no-align --command="SELECT COUNT(*) FROM django_migrations" | grep -Eq '^[1-9][0-9]*      - run: python manage.py check
        working-directory: backend
        env: { DJANGO_SECRET_KEY: ci-only-not-a-secret, DJANGO_DEBUG: 'true' }
      - run: pytest
        working-directory: backend
        env: { DJANGO_SECRET_KEY: ci-only-not-a-secret, DJANGO_DEBUG: 'true' }
      - name: Upload generated migration candidates for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-django-migration-candidates
          path: backend/apps/*/migrations/*.py
          if-no-files-found: warn
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: ai_services/pyproject.toml }
      - run: pip install -e '.[dev]'
        working-directory: ai_services
      - run: pytest
        working-directory: ai_services
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package.json }
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile

          dropdb --maintenance-db="$MAINTENANCE_URL" agency_workforce_restore
      - run: python manage.py check
        working-directory: backend
        env: { DJANGO_SECRET_KEY: ci-only-not-a-secret, DJANGO_DEBUG: 'true' }
      - run: pytest
        working-directory: backend
        env: { DJANGO_SECRET_KEY: ci-only-not-a-secret, DJANGO_DEBUG: 'true' }
      - name: Upload generated migration candidates for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-django-migration-candidates
          path: backend/apps/*/migrations/*.py
          if-no-files-found: warn
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: ai_services/pyproject.toml }
      - run: pip install -e '.[dev]'
        working-directory: ai_services
      - run: pytest
        working-directory: ai_services
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package.json }
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
